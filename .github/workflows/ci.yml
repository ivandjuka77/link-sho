name: Actions Demo
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  backend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
        working-directory: backend
      - run: npm run lint
        working-directory: backend
    name: Backend Check
  frontend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
    name: Frontend Check

